  color-scheme: light;
}
@media (prefers-color-scheme: dark) {

  }
}
:root[data-theme="dark"] {

}
* { box-sizing: border-box; }
html, body { height: 100%; margin: 0; }
body { background: var(--sea); color: var(--ink); font: 14px/1.5 var(--font-body); overflow: hidden; }
#mapbox { position: relative; width: 100%; height: 100%; }
canvas { display: block; width: 100%; height: 100%; cursor: grab; touch-action: none; }
canvas:active { cursor: grabbing; }
.tip { position: absolute; pointer-events: none; background: var(--panel); border: 1px solid var(--border); border-radius: 5px; padding: 9px 11px; font-size: 12.5px; min-width: 180px; box-shadow: 0 4px 16px rgba(0,0,0,0.14); display: grid; gap: 3px; z-index: 2; }
.tip[hidden] { display: none; }
.tip h3 { margin: 0 0 3px; font: 700 15px var(--font-display); font-stretch: 85%; display: flex; align-items: center; gap: 7px; }
.tip .sw { width: 11px; height: 11px; border-radius: 2px; flex: none; border: 1px solid var(--line); }
.tip .kv { display: flex; justify-content: space-between; gap: 16px; color: var(--muted); }
.tip .kv b { font-family: var(--font-mono); font-weight: 500; color: var(--ink); font-variant-numeric: tabular-nums; }
</style>

    W = r.width; H = r.height; dpr = window.devicePixelRatio || 1;
    canvas.width = Math.round(W * dpr); canvas.height = Math.round(H * dpr);
    proj.scale(1).translate([0, 0]).fitExtent([[16, 16], [W - 16, H - 16]], viewGeo);
    base = { s: proj.scale(), t: proj.translate() };
    applyT(); draw();
  }
  function path(ring) {
    let p = proj(ring[0]); ctx.moveTo(p[0], p[1]);
    for (let i = 1; i < ring.length; i++) { p = proj(ring[i]); ctx.lineTo(p[0], p[1]); }
    ctx.closePath();
  }
  function borders() {
    const b = D.borders;
    for (let i = 0; i < b.length; i += 4) {
      const p = proj([b[i], b[i + 1]]), q = proj([b[i + 2], b[i + 3]]);
      ctx.moveTo(p[0], p[1]); ctx.lineTo(q[0], q[1]);
    }
  }
  function label(str, x, y, bold) {
    ctx.font = `${bold ? 800 : 700} ${bold ? 16 : 13}px Archivo, "Arial Narrow", Arial, sans-serif`;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.lineJoin = 'round';
    ctx.lineWidth = 3.5; ctx.strokeStyle = C.halo; ctx.strokeText(str, x, y);
    ctx.fillStyle = C.ink; ctx.fillText(str, x, y);
  }

  function draw() {
    ctx.setTransform(dpr, 0, 0, dpr, 0, 0);
    ctx.fillStyle = C.sea; ctx.fillRect(0, 0, W, H);
    ctx.beginPath(); D.land.forEach(path); ctx.fillStyle = C.land; ctx.fill('evenodd');
    ctx.save(); ctx.clip('evenodd');
    RG.forEach((r, i) => {
      ctx.beginPath(); r.polys.forEach(path);
      ctx.globalAlpha = hover >= 0 && hover !== i ? 0.35 : 1;
      ctx.fillStyle = r.color; ctx.fill();
    });
    ctx.globalAlpha = 1;
    ctx.beginPath(); borders(); ctx.lineWidth = 1.6; ctx.strokeStyle = C.gap; ctx.stroke();
    if (hover >= 0) { ctx.beginPath(); RG[hover].polys.forEach(path); ctx.lineWidth = 2.2; ctx.strokeStyle = C.ink; ctx.stroke(); }
    ctx.restore();
    ctx.beginPath(); D.land.forEach(path); ctx.lineWidth = 0.9; ctx.strokeStyle = C.border; ctx.setLineDash([3, 2]); ctx.stroke(); ctx.setLineDash([]);
    RG.forEach((r, i) => { const p = proj(r.label); label(String(r.rg), p[0], p[1], i === hover); });
  }

  // Zoom & pan; double-click resets the view.
  const zoom = d3.zoom().scaleExtent([0.8, 60]).on('zoom', (e) => { T = e.transform; applyT(); draw(); tip.hidden = true; });
  const sel = d3.select(canvas).call(zoom).on('dblclick.zoom', null);
  canvas.addEventListener('dblclick', () => {
    const reduce = matchMedia('(prefers-reduced-motion: reduce)').matches;
    sel.transition().duration(reduce ? 0 : 500).call(zoom.transform, d3.zoomIdentity);
  });

  function hitTest(mx, my) {
    const ll = proj.invert([mx, my]);
    for (let i = 0; i < N; i++) for (const p of RG[i].polys) if (d3.polygonContains(p, ll)) return i;
    return -1;
  }
  canvas.addEventListener('pointermove', (e) => {
    const rect = canvas.getBoundingClientRect();
    const mx = e.clientX - rect.left, my = e.clientY - rect.top;
    const h = hitTest(mx, my);
    if (h !== hover) { hover = h; draw(); }
    if (h < 0) { tip.hidden = true; return; }
    const r = RG[h];
    tip.innerHTML = `<h3><span class="sw" style="background:${r.color}"></span>Row group ${r.rg}</h3>` +
      `<div class="kv">Rows <b>${fmt(r.rows)}</b></div>` +
      `<div class="kv">Rows per km² <b>${fmtD(r.density)}</b></div>`;
    tip.hidden = false;
    const tw = tip.offsetWidth, th = tip.offsetHeight;
    let x = mx + 16, y = my + 16;
    if (x + tw > W - 8) x = mx - tw - 16;
    if (y + th > H - 8) y = my - th - 16;
    tip.style.left = Math.max(8, x) + 'px'; tip.style.top = Math.max(8, y) + 'px';
  });
  canvas.addEventListener('pointerleave', () => { hover = -1; tip.hidden = true; draw(); });

  const retheme = () => { readColors(); draw(); };
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', retheme);
  new MutationObserver(retheme).observe(document.documentElement, { attributes: true, attributeFilter: ['data-theme'] });
  new ResizeObserver(resize).observe(box);
  readColors();
  resize();
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(draw);
})();
</script>
</body>
</html>
